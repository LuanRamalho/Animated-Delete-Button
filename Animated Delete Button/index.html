<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Animated Delete Button</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <button id="deleteBtn">
      <svg viewBox="0 0 24 26" fill="none" 
          stroke="currentColor" stroke-width="2"
          stroke-linecap="round">
        <path class="paper" d="M10 3h5v6h-5z"
              fill="white" stroke="none"/>
        <path class="lid" d="M4 7h16M9 4h6"/>
        <path d="M6 10l1 13h10l1-13M10 13v7M14 13v7"/>
      </svg>
      <span>Delete</span>
    </button>
    <script src="script.js"></script>
  </body>
